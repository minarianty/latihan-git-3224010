name: BankAccount Unit Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: mvn -f Tugas/Tugas04/BankAccountProject/pom.xml test

      - name: Generate coverage report
        run: mvn -f Tugas/Tugas04/BankAccountProject/pom.xml jacoco:report

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Tugas/Tugas04/BankAccountProject/target/site/jacoco/
          if-no-files-found: error